openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Thursday Drop API
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Authentication operations
  - name: profile
    description: User profile operations
  - name: health
    description: Health operations
  - name: releases
    description: Release cycle operations
  - name: wines
    description: Wine operations
  - name: watchlist
    description: Watchlist operations
  - name: email
    description: Email operations
  - name: stripe
    description: Stripe payment operations
  - name: admin
    description: Admin operations
  - name: archive
    description: Archive history operations
paths:
  /auth/signup:
    post:
      operationId: authSignup
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "409":
          description: Email already exists

  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    post:
      operationId: createProfile
      tags: [profile]
      summary: Create or update profile for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /releases:
    get:
      operationId: listReleases
      tags: [releases]
      summary: List all release cycles
      responses:
        "200":
          description: List of release cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseCycle"

  /releases/latest:
    get:
      operationId: getLatestRelease
      tags: [releases]
      summary: Get the latest release cycle with wines
      responses:
        "200":
          description: Latest release with wines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWithWines"
        "404":
          description: No releases found

  /releases/{id}:
    get:
      operationId: getRelease
      tags: [releases]
      summary: Get a release cycle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWithWines"
        "404":
          description: Not found

  /wines:
    get:
      operationId: listWines
      tags: [wines]
      summary: List wines with optional filters
      parameters:
        - name: release_cycle_id
          in: query
          schema:
            type: integer
        - name: region
          in: query
          schema:
            type: string
        - name: min_score
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - name: sold_out
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of wines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wine"

  /wines/{id}:
    get:
      operationId: getWine
      tags: [wines]
      summary: Get a wine by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Wine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wine"
        "404":
          description: Not found

  /wines/stats:
    get:
      operationId: getWineStats
      tags: [wines]
      summary: Get wine stats (regions, score distribution, total count)
      responses:
        "200":
          description: Wine stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WineStats"

  /watchlist/suggestions:
    get:
      operationId: getWatchlistSuggestions
      tags: [watchlist]
      summary: Autocomplete suggestions for wine or producer names
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [wine, producer, all]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: List of suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WineSuggestion"

  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: Get current user watchlist
      responses:
        "200":
          description: Watchlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
        "401":
          description: Unauthorized
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add a wine to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "401":
          description: Unauthorized
        "403":
          description: Free tier limit reached

  /watchlist/{id}:
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove a wine from the watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /email/subscribe:
    post:
      operationId: emailSubscribe
      tags: [email]
      summary: Subscribe email to newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSubscribeInput"
      responses:
        "200":
          description: Subscribed
        "400":
          description: Bad request

  /stripe/create-checkout:
    post:
      operationId: createCheckout
      tags: [stripe]
      summary: Create a Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "401":
          description: Unauthorized

  /stripe/webhook:
    post:
      operationId: stripeWebhook
      tags: [stripe]
      summary: Stripe webhook handler
      responses:
        "200":
          description: Handled

  /stripe/subscription-info:
    get:
      operationId: getSubscriptionInfo
      tags: [stripe]
      summary: Get the current user's subscription info
      responses:
        "200":
          description: Subscription info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionInfo"
        "401":
          description: Unauthorized

  /stripe/cancel-subscription:
    post:
      operationId: cancelSubscription
      tags: [stripe]
      summary: Cancel the current user's subscription
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelSubscriptionResult"
        "401":
          description: Unauthorized
        "400":
          description: No active subscription

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized

  /admin/scrape:
    post:
      operationId: triggerScrape
      tags: [admin]
      summary: Manually trigger the scraper
      responses:
        "200":
          description: Scrape started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResult"
        "401":
          description: Unauthorized

  /admin/send-alerts:
    post:
      operationId: sendAlerts
      tags: [admin]
      summary: Send queued watchlist alerts
      responses:
        "200":
          description: Alerts sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResult"
        "401":
          description: Unauthorized

  /admin/send-picks:
    post:
      operationId: sendWeeklyPicks
      tags: [admin]
      summary: Send weekly picks email to Pro subscribers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyPicksInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResult"
        "401":
          description: Unauthorized

  /archive/history:
    get:
      operationId: getArchiveHistory
      tags: [archive]
      summary: Get historical archive appearances for a wine
      parameters:
        - name: wine_name
          in: query
          required: true
          schema:
            type: string
        - name: vintage
          in: query
          required: false
          schema:
            type: string
            nullable: true
        - name: bottle_size
          in: query
          required: false
          schema:
            type: string
            nullable: true
      responses:
        "200":
          description: Archive history for the wine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WineHistory"
        "400":
          description: Missing wine_name parameter

components:
  schemas:
    AuthCredentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        profile:
          $ref: "#/components/schemas/Profile"
      required: [token, profile]

    Profile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        is_pro:
          type: boolean
        is_admin:
          type: boolean
        stripe_customer_id:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, email, is_pro, is_admin, created_at]

    CreateProfileInput:
      type: object
      properties:
        email:
          type: string
      required: [email]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ReleaseCycle:
      type: object
      properties:
        id:
          type: integer
        program_id:
          type: string
        program_label:
          type: string
        program_type:
          type: string
        release_date:
          type: ["string", "null"]
        closing_date:
          type: ["string", "null"]
        scraped_at:
          type: string
        wine_count:
          type: integer
      required: [id, program_id, program_label, program_type, scraped_at, wine_count]

    Wine:
      type: object
      properties:
        id:
          type: integer
        release_cycle_id:
          type: integer
        wine_name:
          type: string
        producer:
          type: ["string", "null"]
        lcbo_number:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        region_category:
          type: ["string", "null"]
        vintage:
          type: ["string", "null"]
        score:
          type: ["number", "null"]
        score_source:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
        qty_available:
          type: ["integer", "null"]
        closing_date:
          type: ["string", "null"]
        buy_url:
          type: ["string", "null"]
        bottle_size:
          type: ["string", "null"]
        sold_out:
          type: boolean
      required: [id, release_cycle_id, wine_name, sold_out]

    ReleaseWithWines:
      type: object
      properties:
        release:
          $ref: "#/components/schemas/ReleaseCycle"
        wines:
          type: array
          items:
            $ref: "#/components/schemas/Wine"
      required: [release, wines]

    WineStats:
      type: object
      properties:
        total_wines:
          type: integer
        avg_score:
          type: ["number", "null"]
        regions:
          type: array
          items:
            type: object
            properties:
              region:
                type: string
              count:
                type: integer
            required: [region, count]
        score_distribution:
          type: array
          items:
            type: object
            properties:
              range:
                type: string
              count:
                type: integer
            required: [range, count]
      required: [total_wines, regions, score_distribution]

    WatchlistItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
        wine_name:
          type: string
        vintage:
          type: ["string", "null"]
        producer:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        match_type:
          type: string
          enum: [exact, wine, producer]
        match_threshold:
          type: ["number", "null"]
        created_at:
          type: string
      required: [id, user_id, wine_name, match_type, created_at]

    WatchlistItemInput:
      type: object
      properties:
        wine_name:
          type: string
        vintage:
          type: ["string", "null"]
        producer:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        match_type:
          type: string
          enum: [exact, wine, producer]
        match_threshold:
          type: ["number", "null"]
      required: [wine_name]

    EmailSubscribeInput:
      type: object
      properties:
        email:
          type: string
      required: [email]

    CheckoutInput:
      type: object
      properties:
        plan:
          type: string
          enum: [monthly, annual]
        user_id:
          type: string
        email:
          type: string
      required: [plan, user_id, email]

    CheckoutResult:
      type: object
      properties:
        url:
          type: string
      required: [url]

    SubscriptionInfo:
      type: object
      properties:
        is_pro:
          type: boolean
        plan_type:
          type: ["string", "null"]
          enum: [monthly, annual, null]
        period_end:
          type: ["string", "null"]
        cancel_at_period_end:
          type: boolean
      required: [is_pro, cancel_at_period_end]

    CancelSubscriptionResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    AdminStats:
      type: object
      properties:
        total_subscribers:
          type: integer
        pro_subscribers:
          type: integer
        mrr:
          type: number
        total_wines:
          type: integer
        total_releases:
          type: integer
        pending_alerts:
          type: integer
        pending_real_alerts:
          type: integer
        pending_test_alerts:
          type: integer
        pending_real_users:
          type: integer
      required: [total_subscribers, pro_subscribers, mrr, total_wines, total_releases, pending_alerts, pending_real_alerts, pending_test_alerts, pending_real_users]

    ScrapeResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        wines_found:
          type: integer
      required: [success, message]

    WineSuggestion:
      type: object
      properties:
        id:
          type: integer
        display_name:
          type: string
        producer:
          type: string
          nullable: true
        wine_name:
          type: string
          nullable: true
        type:
          type: string
        count:
          type: integer
      required: [id, display_name, type, count]

    AlertResult:
      type: object
      properties:
        success:
          type: boolean
        sent:
          type: integer
        message:
          type: string
      required: [success, sent, message]

    WeeklyPicksInput:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
      required: [subject, body]

    WineHistory:
      type: object
      properties:
        count:
          type: integer
        last_seen_month:
          type: string
          nullable: true
        prices:
          type: array
          items:
            type: number
        vintages:
          type: array
          items:
            type: string
        bottle_sizes:
          type: array
          items:
            type: string
      required: [count, prices, vintages]
